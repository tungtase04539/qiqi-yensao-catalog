<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>QiQi Yến Sào · Catalog Báo Giá / 报价单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/stPageFlip.css">
<style>
  :root{
    --red:#8E141C; --red2:#A3161B; --gold:#C49A45; --gold-l:#E8C45A; --cream:#F7F1E3; --ink:#2a2622;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #3a2d22 0%, transparent 60%),
      linear-gradient(180deg,#241c16,#15110d);
    color:#f3e7c9; font-family:'Be Vietnam Pro',system-ui,sans-serif;
    display:flex; flex-direction:column; min-height:100%;
    overflow:hidden;
  }
  header{
    position:relative; flex:none;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:10px 22px;
    border-bottom:1px solid rgba(196,154,69,.25);
  }
  /* Brand logo — same mark as the catalog cover (logo2). */
  .brand{display:flex; align-items:center; min-width:0;}
  .brand img{height:50px; width:auto; display:block;}
  /* Page counter — moved up into the header, centred. */
  .counter{
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:15px; letter-spacing:.06em; color:#d9c79c;
    font-variant-numeric:tabular-nums; white-space:nowrap; pointer-events:none;
  }
  .counter b{color:var(--gold-l);font-weight:700;}
  .lang{display:flex;gap:6px;flex:none;}
  .lang button{
    font:600 13px/1 'Be Vietnam Pro',sans-serif; letter-spacing:.04em;
    color:#e9d6ae; background:transparent; border:1px solid rgba(196,154,69,.5);
    padding:8px 14px; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .lang button.active{background:var(--gold); color:#3a2410; border-color:var(--gold);}
  .lang button:hover{border-color:var(--gold-l);}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:10px; min-height:0;}
  /* Book size is computed in JS from the page aspect ratio (landscape on
     desktop/tablet, 9:16 portrait on phones) so it fills the screen. */
  .bookwrap{ margin:0 auto; }
  #flip{ touch-action: pan-y; min-width:0 !important; }
  /* HTML-render pages: real <img> elements stay crisp at any device-pixel-ratio
     (the canvas renderer used by loadFromImages blurs on high-DPR phones). */
  #flip .page{ background:#F7F1E3; overflow:hidden; }
  #flip .page img{ width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; user-select:none; }
  .stPage{ background:#F7F1E3; }

  /* Prev / next buttons flank the page on the left & right (saves vertical space). */
  .nav{
    position:fixed; top:50%; transform:translateY(-50%);
    width:56px;height:56px;border-radius:50%;cursor:pointer; z-index:30;
    background:rgba(34,26,18,.72); border:1px solid rgba(196,154,69,.6); color:var(--gold-l);
    font-size:24px; display:flex;align-items:center;justify-content:center;
    transition:background .2s,color .2s,transform .08s; user-select:none;
    box-shadow:0 6px 20px rgba(0,0,0,.35); backdrop-filter:blur(2px);
  }
  .nav.prev{left:22px;} .nav.next{right:22px;}
  .nav:hover{background:var(--gold); color:#3a2410;}
  .nav:active{transform:translateY(-50%) scale(.93);}

  @media (max-width:600px){
    header{padding:9px 12px;}
    .brand img{height:40px;}
    .lang button{padding:7px 11px;font-size:12px;}
    .nav{width:44px;height:44px;font-size:20px;}
    .nav.prev{left:8px;} .nav.next{right:8px;}
    /* On phones the centred counter would collide with the language buttons,
       so move it to a pill at the bottom centre. */
    .counter{
      position:fixed; top:auto; bottom:16px; left:50%; transform:translateX(-50%);
      font-size:13px; padding:7px 18px; border-radius:999px;
      background:rgba(34,26,18,.72); border:1px solid rgba(196,154,69,.5);
      backdrop-filter:blur(2px);
    }
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><img src="lib/logo2.webp" alt="QiQi Yến"></div>
    <div class="counter"><span id="pglabel">Trang</span> <b id="cur">1</b> / <span id="total">22</span></div>
    <div class="lang">
      <button id="btn-vi" class="active" onclick="setLang('vi')">Tiếng Việt</button>
      <button id="btn-cn" onclick="setLang('cn')">中文</button>
    </div>
  </header>

  <main><div class="bookwrap"><div id="flip"></div></div></main>

  <div class="nav prev" onclick="book && book.flipPrev()" aria-label="Trang trước">‹</div>
  <div class="nav next" onclick="book && book.flipNext()" aria-label="Trang sau">›</div>

  <script src="lib/page-flip.browser.js"></script>
  <script>
    var PAGES = { vi: 22, cn: 22 };
    var PGLABEL = { vi: 'Trang', cn: '页' };
    var book = null, currentLang = 'vi', booksLoaded = false;

    // Detect phone vs tablet/desktop → choose page set & aspect.
    // Phones get the 9:16 portrait layout; tablets & desktops get A4 landscape.
    var IS_PHONE = (function () {
      var ua = navigator.userAgent || '';
      var ipad = /iPad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var androidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);
      if (ipad || androidTablet) return false;                 // tablets → landscape
      return /iPhone|iPod|Android.*Mobile|Windows Phone|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);
    })();
    var PAGEDIR = IS_PHONE ? 'pages-9x16' : 'pages';
    var PW = IS_PHONE ? 1080 : 1123;
    var PH = IS_PHONE ? 1920 : 794;
    var ASPECT = PW / PH;   // width / height
    document.documentElement.setAttribute('data-mode', IS_PHONE ? 'portrait' : 'landscape');

    function sizeBook(){
      var wrap = document.querySelector('.bookwrap');
      var header = document.querySelector('header');
      var headerH = header ? header.offsetHeight : 66;
      var availH = window.innerHeight - headerH - (IS_PHONE ? 18 : 26);
      var availW = window.innerWidth * (IS_PHONE ? 0.98 : 0.96);
      wrap.style.width = Math.min(availW, availH * ASPECT) + 'px';
    }

    function makePages(lang){
      // Build real DOM page elements (HTML render → crisp on every screen).
      var arr = [];
      for (var i = 1; i <= PAGES[lang]; i++) {
        var d = document.createElement('div');
        d.className = 'page';
        var img = document.createElement('img');
        img.src = PAGEDIR + '/' + lang + '/' + String(i).padStart(2,'0') + '.jpg';
        img.alt = ''; img.draggable = false; img.decoding = 'async';
        d.appendChild(img);
        arr.push(d);
      }
      return arr;
    }
    function setCounter(idx){
      // In two-page (landscape) mode StPageFlip reports the left page index.
      document.getElementById('cur').textContent = Math.min(idx + 1, PAGES[currentLang]);
    }
    function ensureBook(){
      if (book) return;
      book = new St.PageFlip(document.getElementById('flip'), {
        width: PW, height: PH,
        size: 'stretch',
        // Force single-page (portrait) always: orientation goes portrait when
        // container width < 2*minWidth. The big minWidth is neutralised for
        // layout by `#flip{min-width:0!important}`, so it only flips the mode.
        minWidth: 3000, maxWidth: 2000,
        minHeight: 1, maxHeight: 4000,
        drawShadow: true, maxShadowOpacity: 0.5,
        flippingTime: 750, usePortrait: true, autoSize: true,
        showCover: false, mobileScrollSupport: false, swipeDistance: 25,
        clickEventForward: true, useMouseEvents: true,
      });
      book.on('flip', function(e){ setCounter(e.data); });
    }
    function setLang(lang){
      currentLang = lang;
      document.documentElement.lang = lang === 'cn' ? 'zh' : 'vi';
      document.getElementById('btn-vi').classList.toggle('active', lang === 'vi');
      document.getElementById('btn-cn').classList.toggle('active', lang === 'cn');
      document.getElementById('pglabel').textContent = PGLABEL[lang];
      document.getElementById('total').textContent = PAGES[lang];
      sizeBook();
      ensureBook();
      // First load uses loadFromHTML; switching languages uses updateFromHtml
      // on the SAME instance (HTML render = crisp DOM <img>, no canvas blur).
      var pages = makePages(lang);
      if (booksLoaded) book.updateFromHtml(pages);
      else { book.loadFromHTML(pages); booksLoaded = true; }
      setCounter(0);
    }
    document.addEventListener('keydown', function(e){
      if (!book) return;
      if (e.key === 'ArrowLeft') book.flipPrev();
      else if (e.key === 'ArrowRight') book.flipNext();
    });
    window.addEventListener('resize', function(){ sizeBook(); if (book && book.update) book.update(); });
    window.addEventListener('load', function(){ setLang('vi'); });
  </script>
</body>
</html>
